# Scoped to the ki3 plugin only. This is a fork of KDE/kwin, so the hook must
# NOT touch upstream sources. `files` is a Python re.search regex on the
# repo-relative path; pre-commit only passes staged files that match it.
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 'v22.1.5'  # ships its own pinned clang-format; independent of system binary
    hooks:
      - id: clang-format
        files: '^src/plugins/ki3/.*\.(cpp|h)$'
